[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stepwatch"
version = "0.2.0"
description = "Documentation visuelle locale des interventions Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow==11.3.0",
    "mss==10.1.0",
    "pynput==1.8.1; sys_platform == 'win32'",
]

[project.gui-scripts]
stepwatch = "stepwatch.__main__:main"

[tool.setuptools.packages.find]
include = ["stepwatch*"]
