[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stepwatch"
version = "0.4.0"
description = "Documentation visuelle locale des interventions Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow==13.0.0",
    "mss==10.2.0",
    "pynput==1.8.2; sys_platform == 'win32'",
]

[project.gui-scripts]
stepwatch = "stepwatch.__main__:main"

[tool.setuptools.packages.find]
include = ["stepwatch*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set: stable across ruff releases whose defaults change.
select = ["E4", "E7", "E9", "F"]
