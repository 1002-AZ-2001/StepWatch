[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stepwatch"
version = "1.2.0"
description = "Documentation visuelle locale des interventions informatiques"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow==13.0.0",
    "PySide6-Essentials==6.12.0",
    "keyring==25.7.0",
    "paramiko==5.1.0",
    "mss==10.2.0",
    "python-xlib==0.33; sys_platform == 'linux'",
]

[project.gui-scripts]
stepwatch = "stepwatch.__main__:main"

[tool.setuptools.packages.find]
include = ["stepwatch*"]

[tool.setuptools.package-data]
stepwatch = ["assets/*.svg"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set: stable across ruff releases whose defaults change.
select = ["E4", "E7", "E9", "F"]
