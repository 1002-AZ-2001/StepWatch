name: Tests et paquets Windows / Debian

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publier la version de main après les tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 — EXE, installateur et ZIP portable
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      STEPWATCH_GUI_TESTS: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Vérifier la version et le tag
        id: metadata
        run: python scripts/ci_metadata.py

      - name: Installer Python et les dépendances
        shell: pwsh
        run: |
          ./scripts/install.ps1 -Python (Get-Command python).Source
          & .\.venv\Scripts\python.exe -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Recompiler le chargeur PyInstaller depuis ses sources
        # Le chargeur précompilé est partagé par de nombreux programmes, y compris
        # malveillants : le recompiler donne une empreinte propre à StepWatch et
        # réduit les faux positifs de certains antivirus (MSVC du runner).
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path requirements-dev.txt -Pattern '^PyInstaller==(.+)$').Matches[0].Groups[1].Value
          & .\.venv\Scripts\python.exe -m pip uninstall -y PyInstaller
          $env:PYINSTALLER_COMPILE_BOOTLOADER = '1'
          & .\.venv\Scripts\python.exe -m pip install --no-cache-dir --no-binary=PyInstaller "PyInstaller==$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tester et construire l'exécutable Windows
        shell: pwsh
        run: ./scripts/build.ps1 -SingleFile

      - name: Vérifier les API Windows et l'exécutable
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe scripts/smoke_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & .\.venv\Scripts\python.exe scripts/smoke_windows.py --executable dist/StepWatch-singlefile.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & .\.venv\Scripts\python.exe scripts/smoke_windows.py --executable dist/StepWatch/StepWatch.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Windowed build: no console; the self-test result is its exit code.
          $selftest = Start-Process -FilePath dist/StepWatch/StepWatch.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($selftest.ExitCode -ne 0) { throw "Auto-test de l'exécutable en échec ($($selftest.ExitCode))." }

          # Informations de version visibles dans les propriétés du fichier.
          $info = (Get-Item dist/StepWatch/StepWatch.exe).VersionInfo
          if ($info.ProductName -ne 'StepWatch' -or $info.ProductVersion -ne '${{ steps.metadata.outputs.version }}') {
            throw "Informations de version absentes de l'exécutable : $($info | Format-List | Out-String)"
          }

      - name: Signer les exécutables (SignPath, si configuré)
        # Activé quand les variables SIGNPATH_* et le secret SIGNPATH_API_TOKEN existent
        # (signature gratuite de la SignPath Foundation pour les projets open source).
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: upload-unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stepwatch-windows-unsigned
          path: |
            dist/StepWatch/StepWatch.exe
            dist/StepWatch-singlefile.exe
          if-no-files-found: error
          retention-days: 1

      - name: Demande de signature SignPath (exécutables)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Remplacer par les exécutables signés
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item signed/StepWatch/StepWatch.exe dist/StepWatch/StepWatch.exe -Force
          Copy-Item signed/StepWatch-singlefile.exe dist/StepWatch-singlefile.exe -Force
          foreach ($file in 'dist/StepWatch/StepWatch.exe', 'dist/StepWatch-singlefile.exe') {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "Signature invalide pour $file : $($signature.StatusMessage)" }
          }

      - name: Construire et tester l'installateur
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-Iscc {
            $found = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
            if ($found) { return $found }
            foreach ($root in ${env:ProgramFiles(x86)}, $env:ProgramFiles) {
              $candidate = Get-ChildItem -Path $root -Filter ISCC.exe -Recurse -Depth 1 -ErrorAction SilentlyContinue |
                Where-Object { $_.DirectoryName -like '*Inno Setup*' } | Select-Object -First 1
              if ($candidate) { return $candidate.FullName }
            }
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw 'Inno Setup (ISCC.exe) introuvable.' }
          Write-Host "Inno Setup : $iscc"
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$PWD\dist\StepWatch" `
            "/DOutputDir=$PWD\dist" "/DIconFile=$PWD\build\windows\stepwatch.ico" packaging\windows\stepwatch.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "dist/StepWatch-$env:APP_VERSION-windows-x64-setup.exe"
          # Installation silencieuse dans le profil, auto-test, puis désinstallation.
          $target = Join-Path $env:RUNNER_TEMP 'StepWatch-installe'
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installation en échec ($($process.ExitCode))." }
          if (-not (Test-Path "$target\unins000.exe")) { throw 'Programme de désinstallation absent.' }
          $selftest = Start-Process -FilePath "$target\StepWatch.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($selftest.ExitCode -ne 0) { throw "Auto-test de la version installée en échec ($($selftest.ExitCode))." }
          $process = Start-Process -FilePath "$target\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Désinstallation en échec ($($process.ExitCode))." }
          Start-Sleep -Seconds 2
          if (Test-Path "$target\StepWatch.exe") { throw 'StepWatch.exe est resté après la désinstallation.' }

      - name: Signer l'installateur (SignPath, si configuré)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: upload-unsigned-setup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stepwatch-windows-setup-unsigned
          path: dist/StepWatch-${{ steps.metadata.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Demande de signature SignPath (installateur)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Remplacer par l'installateur signé
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'StepWatch-${{ steps.metadata.outputs.version }}-windows-x64-setup.exe'
          Copy-Item "signed-setup/$name" "dist/$name" -Force
          $signature = Get-AuthenticodeSignature "dist/$name"
          if ($signature.Status -ne 'Valid') { throw "Signature invalide : $($signature.StatusMessage)" }

      - name: Préparer les fichiers téléchargeables
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts | Out-Null
          Copy-Item dist/StepWatch-singlefile.exe "artifacts/StepWatch-$env:APP_VERSION-windows-x64.exe"
          Copy-Item "dist/StepWatch-$env:APP_VERSION-windows-x64-setup.exe" artifacts/
          Compress-Archive -Path dist/StepWatch -DestinationPath "artifacts/StepWatch-$env:APP_VERSION-windows-x64-portable.zip"
          # Format of sha256sum: "<hash>  <file>", verifiable with sha256sum -c.
          $lines = Get-ChildItem artifacts -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name
          }
          [System.IO.File]::WriteAllText("$PWD/artifacts/SHA256SUMS-windows.txt", ($lines -join "`n") + "`n")
          Get-Content artifacts/SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stepwatch-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux amd64 — lint, tests, paquets Debian et Arch, X11 et Wayland
    # Oldest supported baseline: the package declares glibc >= 2.35.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      STEPWATCH_GUI_TESTS: '1'
      STEPWATCH_X11_TESTS: '1'
      STEPWATCH_GSTREAMER_TESTS: '1'
      DISPLAY: ':99'
      XDG_SESSION_TYPE: x11

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Vérifier la version et le tag
        id: metadata
        run: python scripts/ci_metadata.py

      - name: Installer les outils système
        run: |
          sudo apt-get update -q
          # Bibliothèques de Qt (xcb, Wayland, OpenGL) pour l'auto-test et la capture d'écran.
          sudo apt-get install -y -q xvfb x11-utils dpkg-dev python3-gi binutils \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-pipewire

      - name: Installer les dépendances Python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m pip check

      - name: Lint
        run: .venv/bin/ruff check stepwatch tests scripts

      - name: Démarrer l'affichage de test
        run: |
          Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
          for _ in $(seq 1 50); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.1; done

      - name: Tests (interface Qt comprise)
        run: |
          set -o pipefail
          .venv/bin/python -X faulthandler -u -m unittest discover -s tests -v 2>&1 | tee tests-linux.log

      - name: Conserver les diagnostics des tests Linux
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-linux
          path: tests-linux.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Construire le paquet Debian
        run: .venv/bin/python scripts/build_deb.py --output dist --keep-bundle build/StepWatch

      - name: Ubuntu 22.04 (X11) — installer le paquet, lancement et auto-test
        run: |
          sudo apt-get install -y -q ./dist/stepwatch_${{ steps.metadata.outputs.version }}_amd64.deb
          test -r /opt/stepwatch/_internal/stepwatch/_wayland_portal.py
          .venv/bin/python scripts/smoke_linux_bundle.py /opt/stepwatch/StepWatch
          stepwatch --self-test | tee selftest.log
          grep -q "Synchronisation (dossier, WebDAV, SFTP) : OK" selftest.log
          grep -q "Interface Qt : OK" selftest.log
          grep -q "Capture X11 : OK" selftest.log

      - name: Ubuntu 22.04 (Wayland, weston avec et sans XWayland) — auto-test
        run: |
          sudo apt-get install -y -q weston xwayland
          .venv/bin/python scripts/smoke_wayland.py /usr/bin/stepwatch

      - name: Construire le paquet Arch Linux (makepkg non root)
        run: |
          set -euo pipefail
          .venv/bin/python scripts/build_arch.py --bundle build/StepWatch --output build/arch
          docker run --rm -v "$PWD/build/arch:/build" -w /build archlinux:base-devel bash -euc '
            useradd -m packager
            chown -R packager:packager /build
            runuser -u packager -- makepkg --noconfirm --nodeps
          '
          cp build/arch/stepwatch-*.pkg.tar.zst dist/

      - name: Debian 12 — installer, auto-test et retirer le paquet
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" debian:12-slim bash -euc '
            apt-get update -q
            apt-get install -y -q --no-install-recommends /packages/stepwatch_*_amd64.deb xvfb
            Xvfb :42 -screen 0 1280x800x24 >/dev/null 2>&1 &
            sleep 2
            DISPLAY=:42 stepwatch --self-test | tee /tmp/selftest.log
            grep -q "Interface Qt : OK" /tmp/selftest.log
            grep -q "Capture X11 : OK" /tmp/selftest.log
            apt-get remove -y -q stepwatch
            test ! -e /opt/stepwatch
          '

      - name: Arch Linux — installer, auto-test X11 et Wayland, retirer le paquet
        run: |
          # xvfb-run returns 1 in this container even for "true": start Xvfb directly.
          docker run --rm -v "$PWD/dist:/packages:ro" -v "$PWD/scripts:/scripts:ro" archlinux:base bash -euc '
            pacman -Syu --noconfirm --needed python weston xorg-xwayland xorg-server-xvfb
            pacman -U --noconfirm /packages/stepwatch-*.pkg.tar.zst
            Xvfb :42 -screen 0 1280x800x24 >/dev/null 2>&1 &
            sleep 2
            DISPLAY=:42 stepwatch --self-test | tee /tmp/selftest.log
            grep -q "Interface Qt : OK" /tmp/selftest.log
            grep -q "Capture X11 : OK" /tmp/selftest.log
            python /scripts/smoke_wayland.py /usr/bin/stepwatch
            pacman -R --noconfirm stepwatch
            test ! -e /opt/stepwatch
          '

      - name: Préparer les fichiers téléchargeables
        run: |
          set -euo pipefail
          mkdir artifacts
          cp dist/*.deb dist/*.pkg.tar.zst artifacts/
          (cd artifacts && sha256sum -- *.deb *.pkg.tar.zst > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stepwatch-linux-amd64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    # A new version on main publishes automatically. A manual run on main
    # can request the same publication after rebuilding and testing.
    name: Publier la version
    needs: [windows, linux]
    if: >-
      (github.event_name == 'push' &&
        (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Notes de version depuis CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          python3 scripts/ci_metadata.py >/dev/null
          echo "tag=$(python3 scripts/release_notes.py --output release-notes.md)" >> "$GITHUB_OUTPUT"
          cat release-notes.md

      - name: Vérifier si la version est déjà publiée
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.notes.outputs.tag }}
        run: |
          set -euo pipefail
          publish=true
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::notice::$RELEASE_TAG est déjà publiée ; rien à faire."
              publish=false
            elif gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::notice::Le tag $RELEASE_TAG existe : son propre workflow publie la version."
              publish=false
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.check.outputs.publish == 'true'
        with:
          pattern: stepwatch-*
          path: release-assets
          merge-multiple: true

      - name: Publier les fichiers
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.notes.outputs.tag }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check SHA256SUMS-windows.txt SHA256SUMS-linux.txt)
          title="StepWatch $RELEASE_TAG — Windows, Debian et Arch Linux"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Only reachable from a tag push: refresh that version's files.
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file release-notes.md
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag \
              --title "$title" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" \
              --title "$title" --notes-file release-notes.md --latest
          fi
