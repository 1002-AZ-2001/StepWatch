name: Tests et paquets Windows / Debian

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 — EXE et portable
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      STEPWATCH_GUI_TESTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Vérifier la version et le tag
        id: metadata
        run: python scripts/ci_metadata.py
      - name: Installer Python et les dépendances
        shell: pwsh
        run: |
          ./scripts/install.ps1 -Python (Get-Command python).Source
          & .\.venv\Scripts\python.exe -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tester et construire les deux distributions Windows
        shell: pwsh
        run: ./scripts/build.ps1 -SingleFile
      - name: Vérifier les API Windows et les exécutables construits
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe scripts/smoke_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe scripts/smoke_windows.py --executable dist/StepWatch/StepWatch.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe scripts/smoke_windows.py --executable dist/StepWatch-singlefile.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Préparer les fichiers téléchargeables
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts | Out-Null
          Copy-Item dist/StepWatch-singlefile.exe "artifacts/StepWatch-$env:APP_VERSION-windows-x64.exe"
          Compress-Archive -Path dist/StepWatch -DestinationPath "artifacts/StepWatch-$env:APP_VERSION-windows-x64-portable.zip"
          $Lines = Get-ChildItem artifacts -File | Sort-Object Name | ForEach-Object {
            $Hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$Hash  $($_.Name)"
          }
          $Lines | Set-Content artifacts/SHA256SUMS-windows.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stepwatch-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Debian / Ubuntu amd64 — DEB
    # Build against glibc 2.35, compatible with Ubuntu 22.04+ / Debian 12+.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Vérifier la version et le tag
        run: python scripts/ci_metadata.py
      - name: Installer les outils de construction et d'affichage
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils dpkg-dev xvfb xauth python3-tk desktop-file-utils
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Tester avec un véritable affichage virtuel
        run: xvfb-run -a env STEPWATCH_GUI_TESTS=1 python -m unittest discover -s tests -v
      - name: Construire le paquet Debian
        run: python scripts/build_deb.py
      - name: Installer et vérifier le paquet construit
        run: |
          desktop-file-validate packaging/linux/stepwatch.desktop
          sudo apt-get install --no-install-recommends -y ./dist/stepwatch_*_amd64.deb
          dpkg-query --show --showformat='${Package} ${Version} ${Architecture}\n' stepwatch
          xvfb-run -a python scripts/smoke_linux_bundle.py /usr/bin/stepwatch
      - name: Préparer les fichiers téléchargeables
        run: |
          mkdir artifacts
          cp dist/stepwatch_*_amd64.deb artifacts/
          cd artifacts
          sha256sum ./*.deb > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stepwatch-linux-amd64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publier les paquets du tag
    needs: [windows, linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only this run's artifacts; no repository code executes with write access.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stepwatch-*
          path: release-assets
          merge-multiple: true
      - name: Vérifier et publier les fichiers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS-windows.txt
          sha256sum --check SHA256SUMS-linux.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.exe ./*.zip ./*.deb SHA256SUMS-*.txt --clobber
          else
            gh release create "$RELEASE_TAG" ./*.exe ./*.zip ./*.deb SHA256SUMS-*.txt \
              --verify-tag --title "StepWatch $RELEASE_TAG" --generate-notes
          fi
