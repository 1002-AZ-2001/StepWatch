name: Tests et paquets Windows / Debian

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 — EXE et ZIP portable
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      STEPWATCH_GUI_TESTS: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Vérifier la version et le tag
        id: metadata
        run: python scripts/ci_metadata.py

      - name: Installer Python et les dépendances
        shell: pwsh
        run: |
          ./scripts/install.ps1 -Python (Get-Command python).Source
          & .\.venv\Scripts\python.exe -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tester et construire l'exécutable Windows
        shell: pwsh
        run: ./scripts/build.ps1 -SingleFile

      - name: Vérifier les API Windows et l'exécutable
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe scripts/smoke_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & .\.venv\Scripts\python.exe scripts/smoke_windows.py --executable dist/StepWatch-singlefile.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & .\.venv\Scripts\python.exe scripts/smoke_windows.py --executable dist/StepWatch/StepWatch.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Windowed build: no console; the self-test result is its exit code.
          $selftest = Start-Process -FilePath dist/StepWatch/StepWatch.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($selftest.ExitCode -ne 0) { throw "Auto-test de l'exécutable en échec ($($selftest.ExitCode))." }

      - name: Préparer les fichiers téléchargeables
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts | Out-Null
          Copy-Item dist/StepWatch-singlefile.exe "artifacts/StepWatch-$env:APP_VERSION-windows-x64.exe"
          Compress-Archive -Path dist/StepWatch -DestinationPath "artifacts/StepWatch-$env:APP_VERSION-windows-x64-portable.zip"
          # Format of sha256sum: "<hash>  <file>", verifiable with sha256sum -c.
          $lines = Get-ChildItem artifacts -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name
          }
          [System.IO.File]::WriteAllText("$PWD/artifacts/SHA256SUMS-windows.txt", ($lines -join "`n") + "`n")
          Get-Content artifacts/SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stepwatch-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux amd64 — lint, tests, paquets Debian et Arch, X11 et Wayland
    # Oldest supported baseline: the package declares glibc >= 2.35.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      STEPWATCH_GUI_TESTS: '1'
      DISPLAY: ':99'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Vérifier la version et le tag
        id: metadata
        run: python scripts/ci_metadata.py

      - name: Installer les outils système
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb x11-utils dpkg-dev

      - name: Installer les dépendances Python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m pip check

      - name: Lint
        run: .venv/bin/ruff check stepwatch tests scripts

      - name: Démarrer l'affichage de test
        run: |
          Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
          for _ in $(seq 1 50); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.1; done

      - name: Tests (interface Tk comprise)
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Construire le paquet Debian
        run: .venv/bin/python scripts/build_deb.py --output dist --keep-bundle build/StepWatch

      - name: Ubuntu 22.04 (X11) — installer le paquet, lancement et auto-test
        run: |
          sudo apt-get install -y -q ./dist/stepwatch_${{ steps.metadata.outputs.version }}_amd64.deb
          .venv/bin/python scripts/smoke_linux_bundle.py /opt/stepwatch/StepWatch
          stepwatch --self-test | tee selftest.log
          grep -q "Interface Tk : OK" selftest.log

      - name: Ubuntu 22.04 (Wayland, weston + XWayland) — auto-test
        run: |
          sudo apt-get install -y -q weston xwayland
          .venv/bin/python scripts/smoke_wayland.py /usr/bin/stepwatch

      - name: Construire le paquet Arch Linux (makepkg non root)
        run: |
          set -euo pipefail
          .venv/bin/python scripts/build_arch.py --bundle build/StepWatch --output build/arch
          docker run --rm -v "$PWD/build/arch:/build" -w /build archlinux:base-devel bash -euc '
            useradd -m packager
            chown -R packager:packager /build
            runuser -u packager -- makepkg --noconfirm --nodeps
          '
          cp build/arch/stepwatch-*.pkg.tar.zst dist/

      - name: Debian 12 — installer, auto-test et retirer le paquet
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" debian:12-slim bash -euc '
            apt-get update -q
            apt-get install -y -q --no-install-recommends /packages/stepwatch_*_amd64.deb xvfb
            Xvfb :42 -screen 0 1280x800x24 >/dev/null 2>&1 &
            sleep 2
            DISPLAY=:42 stepwatch --self-test | tee /tmp/selftest.log
            grep -q "Interface Tk : OK" /tmp/selftest.log
            apt-get remove -y -q stepwatch
            test ! -e /opt/stepwatch
          '

      - name: Arch Linux — installer, auto-test X11 et Wayland, retirer le paquet
        run: |
          # xvfb-run returns 1 in this container even for "true": start Xvfb directly.
          docker run --rm -v "$PWD/dist:/packages:ro" -v "$PWD/scripts:/scripts:ro" archlinux:base bash -euc '
            pacman -Syu --noconfirm --needed python weston xorg-xwayland xorg-server-xvfb
            pacman -U --noconfirm /packages/stepwatch-*.pkg.tar.zst
            Xvfb :42 -screen 0 1280x800x24 >/dev/null 2>&1 &
            sleep 2
            DISPLAY=:42 stepwatch --self-test | tee /tmp/selftest.log
            grep -q "Interface Tk : OK" /tmp/selftest.log
            python /scripts/smoke_wayland.py /usr/bin/stepwatch
            pacman -R --noconfirm stepwatch
            test ! -e /opt/stepwatch
          '

      - name: Préparer les fichiers téléchargeables
        run: |
          set -euo pipefail
          mkdir artifacts
          cp dist/*.deb dist/*.pkg.tar.zst artifacts/
          (cd artifacts && sha256sum -- *.deb *.pkg.tar.zst > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stepwatch-linux-amd64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    # One GitHub release per version: merging a new pyproject.toml version
    # into main publishes it (the tag is created here); pushing a matching
    # v* tag works too. A version already published is never replaced from
    # main, so ordinary merges do not touch existing releases.
    name: Publier la version
    needs: [windows, linux]
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Notes de version depuis CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          python3 scripts/ci_metadata.py >/dev/null
          echo "tag=$(python3 scripts/release_notes.py --output release-notes.md)" >> "$GITHUB_OUTPUT"
          cat release-notes.md

      - name: Vérifier si la version est déjà publiée
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.notes.outputs.tag }}
        run: |
          set -euo pipefail
          publish=true
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::notice::$RELEASE_TAG est déjà publiée ; rien à faire."
              publish=false
            elif gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::notice::Le tag $RELEASE_TAG existe : son propre workflow publie la version."
              publish=false
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.check.outputs.publish == 'true'
        with:
          pattern: stepwatch-*
          path: release-assets
          merge-multiple: true

      - name: Publier les fichiers
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.notes.outputs.tag }}
        run: |
          set -euo pipefail
          ls -l release-assets
          title="StepWatch $RELEASE_TAG — Windows, Debian et Arch Linux"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Only reachable from a tag push: refresh that version's files.
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file release-notes.md
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag \
              --title "$title" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" \
              --title "$title" --notes-file release-notes.md --latest
          fi
