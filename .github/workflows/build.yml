name: Tests et paquet Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 — EXE
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      STEPWATCH_GUI_TESTS: '1'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Vérifier la version et le tag
        id: metadata
        run: python scripts/ci_metadata.py

      - name: Installer Python et les dépendances
        shell: pwsh
        run: |
          ./scripts/install.ps1 -Python (Get-Command python).Source
          & .\.venv\Scripts\python.exe -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tester et construire l'exécutable Windows
        shell: pwsh
        run: ./scripts/build.ps1 -SingleFile

      - name: Vérifier les API Windows et l'exécutable
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe scripts/smoke_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & .\.venv\Scripts\python.exe scripts/smoke_windows.py --executable dist/StepWatch-singlefile.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Préparer le fichier téléchargeable
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts | Out-Null
          Copy-Item dist/StepWatch-singlefile.exe "artifacts/StepWatch-$env:APP_VERSION-windows-x64.exe"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stepwatch-windows-x64
          path: artifacts/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publier l'exécutable Windows
    needs: [windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stepwatch-windows-x64
          path: release-assets

      - name: Publier l'exécutable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release-assets

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.exe --clobber
          else
            gh release create "$RELEASE_TAG" ./*.exe \
              --verify-tag \
              --title "StepWatch $RELEASE_TAG" \
              --generate-notes
          fi
